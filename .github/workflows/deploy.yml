name: Deploy to Cloudflare

# Runs on every push to the default branch and can be started by hand from the Actions tab.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main, master, claude/admiring-shannon-32kak0]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RAW_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RAW_CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      # Pasted secrets often carry a trailing newline/space, or the whole
      #   curl ... -H "Authorization: Bearer <token>"
      # line that the Cloudflare dashboard shows after creating a token. Clean both up
      # (values are never printed).
      - name: Normalize Cloudflare credentials
        run: |
          token="$(printf '%s' "$RAW_CF_TOKEN" | tr -d '[:space:]')"
          account="$(printf '%s' "$RAW_CF_ACCOUNT" | tr -d '[:space:]')"
          # If the secret holds the whole `curl ... -H "Authorization: Bearer <token>"` line, keep only the
          # token: everything after "Bearer" up to the closing quote (the character set excludes quotes).
          if printf '%s' "$token" | grep -qE 'Bearer[A-Za-z0-9_-]+'; then
            token="$(printf '%s' "$token" | sed -E 's/.*Bearer([A-Za-z0-9_-]+).*/\1/')"
            echo "note: the token secret contained a pasted curl command; extracted the token from it (please store only the token)"
          fi
          echo "::add-mask::$token"
          echo "::add-mask::$account"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"
          [ -n "$token" ] && [ -n "$account" ] || { echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secret is empty"; exit 1; }

          # Shape check only (values are never printed). Cloudflare tokens come in two forms:
          #   legacy: 40 chars of [A-Za-z0-9_-]
          #   current: a prefix like cfut_/cfat_ + 40 chars + 8-char checksum = 53 chars
          bad_chars="$(printf '%s' "$token" | tr -d 'A-Za-z0-9_-' | wc -c)"
          echo "token: length=${#token}, characters outside [A-Za-z0-9_-]: ${bad_chars}"
          if printf '%s' "$token" | grep -Eq '^cf[a-z]{2}_[A-Za-z0-9]{48}$'; then echo "token format: current (prefixed)";
          elif printf '%s' "$token" | grep -Eq '^[A-Za-z0-9_-]{40}$'; then echo "token format: legacy (40 chars)";
          else echo "::error::Token does not look like a Cloudflare API token (expected cfXX_ + 48 chars, or 40 chars). Re-create the secret with only the token."; exit 1; fi
          if printf '%s' "$account" | grep -Eq '^[0-9a-f]{32}$'; then echo "account id: looks valid (32 hex)"; else echo "::error::Account ID has length ${#account}, expected 32 hex chars"; exit 1; fi

      # Informational only: deploys use CLOUDFLARE_ACCOUNT_ID directly and do not need to list accounts.
      - name: Check Cloudflare credentials
        continue-on-error: true
        run: npx wrangler whoami

      # 1) Rooms: the Worker that owns the GameRoom Durable Object.
      - name: Deploy rooms Worker
        run: npx wrangler deploy --config worker/wrangler.toml

      # 2) Game site on Pages (created on first run).
      - name: Create Pages project if missing
        run: npx wrangler pages project create avalon --production-branch main || true
      - name: Deploy Pages
        run: npx wrangler pages deploy public --project-name avalon --branch main --commit-dirty=true

      # 3) /avalon path proxy: luckylion.games/avalon* -> the Pages project.
      #    Override the target with the repository variable PAGES_ORIGIN if the project is ever renamed.
      - name: Deploy /avalon proxy
        run: npx wrangler deploy --config proxy/wrangler.toml --var ORIGIN:${{ vars.PAGES_ORIGIN || 'https://avalon-dli.pages.dev' }}
