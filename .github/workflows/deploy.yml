name: Deploy to Cloudflare

# Runs on every push to the default branch and can be started by hand from the Actions tab.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main, master, claude/admiring-shannon-32kak0]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RAW_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RAW_CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      # Pasted secrets often carry a trailing newline/space, which makes wrangler fail with
      # "invalid header value". Strip all whitespace before using them.
      - name: Normalize Cloudflare credentials
        run: |
          token="$(printf '%s' "$RAW_CF_TOKEN" | tr -d '[:space:]')"
          account="$(printf '%s' "$RAW_CF_ACCOUNT" | tr -d '[:space:]')"
          echo "::add-mask::$token"
          echo "::add-mask::$account"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"
          [ -n "$token" ] && [ -n "$account" ] || { echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secret is empty"; exit 1; }

      - name: Check Cloudflare credentials
        run: npx wrangler whoami

      # 1) Rooms: the Worker that owns the GameRoom Durable Object.
      - name: Deploy rooms Worker
        run: npx wrangler deploy --config worker/wrangler.toml

      # 2) Game site on Pages (created on first run).
      - name: Create Pages project if missing
        run: npx wrangler pages project create avalon --production-branch main || true
      - name: Deploy Pages
        run: npx wrangler pages deploy public --project-name avalon --branch main --commit-dirty=true

      # 3) /avalon path proxy. Only runs once the repository variable PAGES_ORIGIN is set
      #    to the project's *.pages.dev address (see README).
      - name: Deploy /avalon proxy
        if: ${{ vars.PAGES_ORIGIN != '' }}
        run: npx wrangler deploy --config proxy/wrangler.toml --var ORIGIN:${{ vars.PAGES_ORIGIN }}
